services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/enterprise_ai_lab
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: embeddinggemma
      EMBEDDING_DIMENSION: "768"
      TOP_K: "${TOP_K:-5}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: enterprise_ai_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
